# /etc/systemd/system/jellyfin.service.d/zz-jellyfin-patch.conf
#
# Starts Jellyfin through /usr/local/sbin/jellyfin-patch, which runs the moj.tv
# patched build for the installed version (or stock Jellyfin when there is none).
# To go back to plain Jellyfin: delete this file, `systemctl daemon-reload`, restart.
[Service]
ExecStartPre=+/usr/local/sbin/jellyfin-patch prepare
ExecStart=
ExecStart=/usr/local/sbin/jellyfin-patch run $JELLYFIN_WEB_OPT $JELLYFIN_FFMPEG_OPT $JELLYFIN_SERVICE_OPT $JELLYFIN_NOWEBAPP_OPT $JELLYFIN_ADDITIONAL_OPTS
# Counts crashes of the patched build right after starting; after two, Jellyfin starts stock.
ExecStopPost=+/usr/local/sbin/jellyfin-patch stopped
# prepare may download the build for a freshly installed version.
TimeoutStartSec=300
